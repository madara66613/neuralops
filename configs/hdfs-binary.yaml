project: neuralops
run_name: hdfs-v1-binary-gru
seed: 42
task:
  source: loghub-hdfs-v1
  profile: hdfs-v1-deduplicated-sequence
  type: binary
  category_head: false
  severity_head: false
data:
  raw_dir: data/raw/hdfs-v1
  processed_dir: data/processed/hdfs-v1
  deduplicate: true
  split:
    train: 0.70
    validation: 0.15
    test: 0.15
    group_key: block_id
    strategy: duplicate-clustered-stable-hash
model:
  embedding_dim: 64
  hidden_dim: 128
  layers: 1
  bidirectional: true
  dropout: 0.20
training:
  batch_size: 128
  epochs: 30
  patience: 5
  learning_rate: 0.001
  gradient_clip_norm: 1.0
  device: auto
evaluation:
  threshold_objective: f1
  minimum_selective_coverage: 0.80
