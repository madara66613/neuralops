project: neuralops
run_name: opsforge-sim-v1-multitask-gru
seed: 42
task:
  source: opsforge-sim-v1
  profile: opsforge-sim-v1-multitask
  type: multitask
  category_head: true
  severity_head: true
data:
  processed_dir: data/processed/opsforge-sim-v1
  synthetic_samples: 6000
  deduplicate: true
  split:
    train: 0.70
    validation: 0.15
    test: 0.15
    group_key: incident_id
    strategy: duplicate-clustered-stable-hash
model:
  embedding_dim: 64
  hidden_dim: 128
  layers: 1
  bidirectional: true
  dropout: 0.20
  max_sequence_length: 128
training:
  batch_size: 128
  epochs: 30
  patience: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  category_loss_weight: 0.5
  severity_loss_weight: 0.3
  device: auto
evaluation:
  threshold_objective: f1
  minimum_selective_coverage: 0.80
