project: neuralops
run_name: opsforge-sim-v1-multitask-gru
seed: 42
task:
  source: opsforge-sim-v1
  type: multitask
  category_head: true
  severity_head: true
data:
  processed_dir: data/processed/opsforge-sim-v1
  synthetic_samples: 6000
  split:
    train: 0.70
    validation: 0.15
    test: 0.15
    group_key: incident_id
    strategy: duplicate-clustered-stable-hash
model:
  embedding_dim: 64
  hidden_dim: 128
  layers: 1
  bidirectional: true
  dropout: 0.20
training:
  batch_size: 128
  epochs: 30
  patience: 5
  learning_rate: 0.001
  gradient_clip_norm: 1.0
  device: auto
evaluation:
  threshold_objective: f1
  minimum_selective_coverage: 0.80

