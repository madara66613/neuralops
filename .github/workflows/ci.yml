name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy neuralops
      - name: Tests
        run: pytest --cov=neuralops --cov-report=term-missing
      - name: CLI smoke test
        run: neuralops doctor

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e

  docker:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled artifact
        working-directory: demo/artifact
        run: sha256sum --check SHA256SUMS
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Smoke test console and inference
        run: |
          curl --fail --silent http://127.0.0.1:4173/healthz
          curl --fail --silent http://127.0.0.1:4173/api/ready
          curl --fail --silent http://127.0.0.1:8001/version
          curl --fail --silent http://127.0.0.1:4173/api/predict \
            -H 'Content-Type: application/json' \
            --data '{"events":["E001","E012","E104","E207","E104","E431","P07","E087","E099"]}' \
            | python -c 'import json,sys; assert json.load(sys.stdin)["prediction"]["label_provenance"] == "synthetic"'
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
